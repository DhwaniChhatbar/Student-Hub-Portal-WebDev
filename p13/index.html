
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practical 13 - Student CRUD</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
            background: #f4f6f9;
            color: #222;
        }

        h1, h2 {
            color: #1d3557;
        }

        form, .table-container {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        input {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin: 8px 0 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            padding: 9px 14px;
            margin: 3px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background: #1d70b8;
            color: white;
        }

        .delete-btn {
            background: #c0392b;
        }

        .cancel-btn {
            background: #666;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #eaf0f6;
        }

        #message {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 4px;
        }

        [hidden] {
            display: none !important;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }

        .info {
            background: #dbeafe;
            color: #1e40af;
        }
    </style>
</head>
<body>

    <h1>Student Management System</h1>
    <p>PHP JSON API and Fetch API CRUD</p>

    <div id="message" role="status" aria-live="polite" hidden></div>

    <form id="studentForm">
        <h2 id="formTitle">Add Student</h2>

        <label for="name">Name</label>
        <input type="text" id="name" maxlength="100" required>

        <label for="email">Email</label>
        <input type="email" id="email" maxlength="150" required>

        <label for="course">Course</label>
        <input type="text" id="course" maxlength="100" required>

        <button type="submit" id="submitBtn">Add Student</button>
        <button type="button" id="cancelBtn" class="cancel-btn" hidden>
            Cancel Edit
        </button>
    </form>

    <section class="table-container">
        <h2>Student List</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Course</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="studentList">
                <tr>
                    <td colspan="5">Loading students...</td>
                </tr>
            </tbody>
        </table>
    </section>

    <script src="script.js"></script>
</body>
</html>
